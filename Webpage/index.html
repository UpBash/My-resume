<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panos Kabasis - Portfolio</title>
    <style>
        body {
            background-color: #f5f0e6;
            font-family: 'Times New Roman', serif;
            margin: 0;
            padding: 40px;
            color: #1a1a1a;
            text-align: left;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: space-between;
        }

        .content {
            width: 65%;
        }

        header {
            font-size: 5rem;
            font-weight: bold;
            text-transform: uppercase;
            border-bottom: 5px solid black;
            margin-bottom: 40px;
        }

        .profile-pic {
            width: 30%;
            text-align: center;
        }
        .profile-pic img {
            max-width: 80%;
            height: auto;
            border-radius: 10px;
            box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.3);
        }

        .section {
            max-width: 900px;
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 3rem;
            font-weight: bold;
            text-transform: uppercase;
            border-bottom: 3px solid black;
            margin-bottom: 20px;
        }

        .document {
            font-size: 2rem;
            font-weight: bold;
            text-decoration: none;
            color: black;
            margin: 10px 0;
            border-bottom: 2px solid black;
            width: max-content;
            cursor: pointer;
            position: relative;
        }

        .doc-options {
            display: none;
            position: absolute;
            top: 0;
            left: 110%;
            flex-direction: column;
            gap: 5px;
            background: white;
            padding: 10px;
            border: 2px solid black;
            border-radius: 5px;
            box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.3);
        }
        .doc-options a {
            text-decoration: none;
            color: black;
            font-size: 1.5rem;
            padding: 5px 10px;
        }

        .pdf-viewer {
            display: none;
            position: fixed;
            top: 10%;
            left: 50%;
            transform: translate(-50%, 0);
            width: 80%;
            height: 80%;
            background: white;
            border: 2px solid black;
            box-shadow: 10px 10px 20px rgba(0, 0, 0, 0.3);
            padding: 10px;
            z-index: 1000;
        }
        .pdf-viewer iframe {
            width: 100%;
            height: 90%;
        }
        .close-btn {
            cursor: pointer;
            font-size: 1.5rem;
            font-weight: bold;
            text-align: right;
            display: block;
        }

        /* Canvas Background for Mathematical Doodles */
        #mathCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
    </style>
</head>
<body>
    <canvas id="mathCanvas"></canvas>
    <div class="content">
        <header>Panos Kabasis</header>

        <div class="section">
            <div class="section-title">About</div>
            <p>Data Scientist | AI Researcher | Problem Solver</p>
            <p>Welcome to my portfolio, where I showcase my research, projects, and technical expertise.</p>
        </div>

        <div class="section">
            <div class="section-title">Documents</div>
            <p class="document" onclick="toggleOptions(this)">Curriculum Vitae
                <span class="doc-options">
                    <a href="cv.pdf" download>Download</a>
                    <a href="#" onclick="openPDF('cv.pdf')">Display</a>
                </span>
            </p>
            <p class="document" onclick="toggleOptions(this)">Thesis
                <span class="doc-options">
                    <a href="thesis.pdf" download>Download</a>
                    <a href="#" onclick="openPDF('thesis.pdf')">Display</a>
                </span>
            </p>
        </div>
    </div>

    <div class="profile-pic">
        <img src="DSC_0124ivol2.jpg" alt="Profile Picture">
    </div>

    <script>
        function openPDF(pdfFile) {
            document.getElementById("pdfViewer").style.display = "block";
            document.getElementById("pdfFrame").src = pdfFile;
        }
        function closePDF() {
            document.getElementById("pdfViewer").style.display = "none";
            document.getElementById("pdfFrame").src = "";
        }

        function toggleOptions(element) {
            let options = element.querySelector(".doc-options");
            options.style.display = options.style.display === "flex" ? "none" : "flex";
        }

        // Math Equations Generator
        const canvas = document.getElementById("mathCanvas");
        const ctx = canvas.getContext("2d");
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        let equations = ["∫ f(x) dx", "E = mc²", "π ≈ 3.1416", "a² + b² = c²", "∂/∂x", "lim x→∞", "∂u/∂t = Δu + u - u³ (Allen-Cahn)", "y = Wx + b", "model.fit(X, y)", "loss.backward()"];
        function drawEquation(equation, x, y) {
            let index = 0;
            ctx.font = "16px Times New Roman";
            function drawCharacter() {
                if (index < equation.length) {
                    ctx.fillText(equation[index], x + index * 10, y);
                    index++;
                    setTimeout(drawCharacter, 50);
                }
            }
            drawCharacter();
        }
        function drawRandomMath() {
            let x = Math.random() * (canvas.width - 200);
            let y = Math.random() * (canvas.height - 50) + 30;
            let equation = equations[Math.floor(Math.random() * equations.length)];
            drawEquation(equation, x, y);
        }
        setInterval(drawRandomMath, 3000);
    </script>
</body>
</html>
